<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Natalia and Stella's Ranch Life</title>

  <style>
    /* Fill the whole browser window, no scrollbars, no white flash:
       the page background is the same sky blue the 3D scene uses. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
    }

    canvas {
      display: block; /* removes the tiny gap under an inline canvas */
    }

    /* Friendly hint box in the bottom-left corner. Big and easy to read. */
    #hint {
      position: fixed;
      left: 20px;
      bottom: 20px;
      max-width: 60vw;
      padding: 14px 20px;
      border-radius: 18px;
      background: rgba(20, 24, 30, 0.62);
      color: #ffffff;
      font-family: "Comic Sans MS", "Trebuchet MS", "Segoe UI Rounded", Verdana, sans-serif;
      font-size: 22px;
      line-height: 1.35;
      font-weight: bold;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.45);
      pointer-events: none; /* clicks pass through to the game */
      user-select: none;
    }

    /* The "Press E to ..." prompt. It sits low and in the middle of the
       screen, just above the hint box, where the player is already looking.
       It is invisible until the game adds the "visible" class to it. */
    #prompt {
      position: fixed;
      left: 50%;
      /* Clear of the three-line hint box in the bottom-left corner. */
      bottom: 150px;
      transform: translateX(-50%);
      padding: 12px 26px;
      border-radius: 18px;
      background: rgba(20, 24, 30, 0.72);
      color: #ffffff;
      font-family: "Comic Sans MS", "Trebuchet MS", "Segoe UI Rounded", Verdana, sans-serif;
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      user-select: none;
      opacity: 0;                       /* hidden by default */
      transition: opacity 0.15s ease;   /* a quick, gentle fade */
    }

    /* The little feedback message, e.g. "Yum! Biscuit is happy."
       Same idea as the prompt, but up at the top and in a warm colour. */
    #message {
      position: fixed;
      left: 50%;
      top: 40px;
      transform: translateX(-50%);
      padding: 12px 26px;
      border-radius: 18px;
      background: rgba(120, 140, 40, 0.82); /* warm yellow-green */
      color: #ffffff;
      font-family: "Comic Sans MS", "Trebuchet MS", "Segoe UI Rounded", Verdana, sans-serif;
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      user-select: none;
      opacity: 0;                       /* hidden by default */
      transition: opacity 0.35s ease;   /* fades out a little more slowly */
    }

    /* The game adds this class to show either box, and takes it away to hide it. */
    #prompt.visible,
    #message.visible {
      opacity: 1;
    }
  </style>

  <!-- Import map: tells the browser where the bare name "three" points to.
       No npm and no bundler needed - the browser loads it straight from the CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- On-screen controls hint, kept short and easy to read. -->
  <div id="hint">
    Walk: W A S D or the arrow keys<br>
    Look around: hold the mouse button and drag<br>
    Feed: walk up to the horse and press E
  </div>

  <!-- "Press E to ..." appears here when Natalia is close to something. -->
  <div id="prompt"></div>

  <!-- Short feedback, like "Yum! Biscuit is happy.", flashes up here. -->
  <div id="message"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
