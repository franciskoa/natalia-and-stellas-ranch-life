<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Natalia and Stella's Ranch Life</title>

  <!-- What a search engine, a chat app or a phone's "add to home screen" shows
       about this page. One friendly sentence is plenty. -->
  <meta name="description"
        content="A gentle open-world farm game for children: ride and feed your horses, raise chickens, grow vegetables and trade with the neighbours.">

  <!-- The colour a phone paints its address bar and task switcher with: the
       same sky blue the game itself uses, so the whole thing looks of a piece. -->
  <meta name="theme-color" content="#87ceeb">

  <!-- The little icon on the browser tab: a horse emoji drawn straight into
       the page as a tiny SVG. Writing it as a data: URL means there is no
       favicon.ico file to fetch (and no 404 in the console when there isn't
       one) and still no extra asset in the project folder. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='54'%3E🐴%3C/text%3E%3C/svg%3E">

  <style>
    /* Fill the whole browser window, no scrollbars, no white flash:
       the page background is the same sky blue the 3D scene uses. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
    }

    canvas {
      display: block; /* removes the tiny gap under an inline canvas */
    }

    /* Small, quiet controls list pinned in the bottom-left corner.
       It should read as a note in the margin, not as part of the game. */
    #hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      max-width: 40vw;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(20, 24, 30, 0.55);
      color: #e8ecf2;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      font-weight: normal;
      opacity: 0.85;                 /* lets it recede behind the game */
      pointer-events: none;          /* clicks pass through to the game */
      user-select: none;
      white-space: nowrap;
    }

    /* THE HUD: the small row of numbers in the TOP-LEFT corner, showing what
       Natalia is carrying - coins, horse feed, chicken feed, eggs - and how
       many chickens are in the pen. js/inventory.js fills it in and keeps it
       up to date. It is styled like the hint box in the opposite corner on
       purpose: a quiet note in the margin, never part of the game. */
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(20, 24, 30, 0.55);
      color: #e8ecf2;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.9;
      pointer-events: none;          /* clicks pass through to the game */
      user-select: none;
      white-space: nowrap;
    }

    /* The numbers themselves: "🪙 20 · 🌾 3 · 🥣 5 · 🥚 0 · 🐔 4". */
    #hud-items {
      font-weight: 600;
      color: #ffffff;
    }

    /* The tiny key underneath, so a young player knows what 🌾 means without
       having to hover over anything. Deliberately small and faint. */
    #hud-legend {
      margin-top: 1px;
      font-size: 10px;
      font-weight: normal;
      opacity: 0.62;
    }

    /* The second line: what she has traded for with the neighbours and what she
       has grown in her garden, e.g. "🌽 3 corn · 🥕 3 carrots · 🌱 1 corn seeds".
       js/inventory.js only writes the goods she actually owns into it, and each
       one carries its own word, so this line needs no legend of its own.

       It is the one line in the HUD allowed to WRAP: with seven possible things
       on it (five goods and two kinds of seed) it would otherwise run off the
       side of a narrow screen, and the box it lives in has nothing underneath
       it to push out of the way. */
    #hud-goods {
      margin-top: 3px;
      max-width: 46vw;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      white-space: normal;
      color: #ffe6a8;                /* a warm cream, so it reads as "extra" */
    }

    /* Nothing traded for yet: an empty line would still push the box taller,
       so it is taken out of the layout altogether until there is something
       in it. */
    #hud-goods:empty {
      display: none;
    }

    /* The key names at the start of each line ("Move:", "E:"), a touch
       brighter so the eye can scan down the left edge of the list. */
    #hint b {
      color: #ffffff;
      font-weight: 600;
    }

    /* The "Press E to ..." prompt. It sits low and in the middle of the
       screen, just above the hint box, where the player is already looking.
       It is invisible until the game adds the "visible" class to it. */
    #prompt {
      position: fixed;
      left: 50%;
      /* Clear of the five-line hint box in the bottom-left corner. Five lines
         at 13px and a line-height of 1.4 come to 91px, plus 12px of padding
         and 12px of margin, which puts the top of that box 115px up from the
         bottom of the screen. 122px leaves a small gap above it and still
         clears the shorter box on a phone (five lines at 11px: about 101px). */
      bottom: 122px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(20, 24, 30, 0.72);
      color: #ffffff;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.3;                 /* room for the second key on its own line */
      font-weight: 600;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      user-select: none;
      opacity: 0;                       /* hidden by default */
      transition: opacity 0.15s ease;   /* a quick, gentle fade */
    }

    /* The key letters (E, F) inside the prompt: a little brighter than the
       words around them, so a young player spots which key to press. */
    #prompt b {
      color: #ffe082;
    }

    /* THE COMPASS: a small round badge at the very top of the screen with an
       arrow in it, and one word underneath saying where the arrow is pointing.
       js/road.js turns the arrow every frame - it points at the store while
       she is nearer home, and back home once she is nearer the store - and
       sets data-target to "store" or "home", which is what swaps the word.

       The badge is the outer box (it never turns); #compass inside it is the
       only thing road.js rotates, so the word underneath always stays the
       right way up. */
    #compass-badge {
      position: fixed;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      pointer-events: none;          /* clicks pass through to the game */
      user-select: none;
      z-index: 4;
    }

    #compass {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(20, 24, 30, 0.55);
      color: #ffe082;                /* the same warm yellow as the key hints */
      font-size: 17px;
      line-height: 34px;             /* centres the arrow in the circle */
      text-align: center;
      /* road.js replaces this every frame with the angle to point at. */
      transform: rotate(0deg);
    }

    #compass-label {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 600;
      color: #e8ecf2;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    /* The word under the badge. It is written in CSS rather than in JavaScript
       so that road.js only ever has to set one attribute. */
    #compass-label::after {
      content: "Store";
    }

    #compass[data-target="home"] + #compass-label::after {
      content: "Home";
    }

    /* The little feedback message, e.g. "Yum! Biscuit is happy."
       Same idea as the prompt, but up at the top and in a warm colour.
       It sits at 84px rather than 40px so it clears the compass badge above
       it, which is 34px of circle plus its word. */
    #message {
      position: fixed;
      left: 50%;
      top: 84px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(120, 140, 40, 0.82); /* warm yellow-green */
      color: #ffffff;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      user-select: none;
      opacity: 0;                       /* hidden by default */
      transition: opacity 0.35s ease;   /* fades out a little more slowly */
    }

    /* The game adds this class to show either box, and takes it away to hide it. */
    #prompt.visible,
    #message.visible {
      opacity: 1;
    }

    /* On a phone-sized screen everything shrinks one more notch so the
       three text boxes still leave the game itself room to breathe. */
    @media (max-width: 700px) {
      #hint,
      #hud {
        font-size: 11px;
      }

      #hud-legend {
        font-size: 9px;
      }

      #prompt,
      #message {
        font-size: 15px;
      }
    }

    /* -----------------------------------------------------------------
       THE BARN MENU (and the store panel, which borrows its look)
       The panel that opens when the player presses E at the barn door:
       pick a horse, then tap a colour for its saddle and its blanket.
       js/menu.js builds all the buttons inside it and adds the "visible"
       class to show it. Everything here is big and round on purpose -
       it has to be easy for an eight-year-old to read and to tap.

       These are CLASSES, not ids, because js/shop.js builds a second panel
       (the store) out of the same pieces. Everything a shop panel adds of
       its own is further down, under "THE STORE PANEL".
       ----------------------------------------------------------------- */

    /* The dark sheet over the whole screen. Hidden until menu.js shows it;
       "visibility: hidden" (not just see-through) means no stray clicks can
       land on the buttons while it is away. */
    .barn-menu {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12, 16, 22, 0.66);
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      user-select: none;
      z-index: 10;                       /* over the canvas and the hints */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease;
    }

    .barn-menu.visible {
      opacity: 1;
      visibility: visible;
    }

    /* The rounded panel itself. 90vw with a 560px ceiling means it fills a
       phone screen and stays a tidy box on a laptop. */
    .barn-panel {
      width: 90vw;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;                  /* a very short screen can scroll */
      box-sizing: border-box;
      padding: 18px 18px 22px;
      border-radius: 16px;
      background: rgba(28, 34, 44, 0.96);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .barn-title {
      margin: 2px 0 16px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* The barn panel is the fullest one in the game - a button for every horse
       on the ranch, two rows of colours AND the whole Foals section - so on a
       wide screen it is given more room than the shop panels, and everything
       inside it is packed a little tighter.

       These three rules are scoped to #barn-menu on purpose: the store, the
       market stall and the trade panel share .barn-panel and .barn-title, and
       none of them should change. */
    #barn-menu .barn-panel {
      max-width: 700px;
      padding: 14px 16px 16px;
    }

    #barn-menu .barn-title {
      margin: 0 0 10px;
      font-size: 24px;
    }

    /* One block per question: "Horse", "Saddle", "Blanket", "Foals". */
    .barn-row {
      margin-bottom: 12px;
    }

    /* A row with its word BESIDE its buttons rather than above them: the
       Saddle and Blanket colours, and the Mum and Dad rows in the Foals
       section. It saves a line of height each time, which is what keeps the
       whole panel readable on a laptop screen without scrolling. */
    .barn-row-inline {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .barn-row-inline .barn-row-label,
    .barn-row-inline .barn-foal-sub {
      flex: 0 0 58px;
      margin-bottom: 0;
    }

    .barn-row-inline .barn-choices {
      flex: 1 1 auto;
      min-width: 0;
      justify-content: flex-start;       /* the circles start beside their word */
    }

    .barn-parent-row {
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .barn-parent-row .barn-foal-sub {
      padding-top: 12px;
    }

    .barn-row-label {
      margin-bottom: 8px;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      color: #ffe082;                    /* the same warm yellow as the keys */
    }

    /* The buttons in a row. They wrap onto the next line on a narrow screen
       instead of running off the side. */
    .barn-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    /* A horse button: its name, with its kind in smaller letters underneath. */
    .barn-horse {
      flex: 1 1 140px;
      max-width: 230px;                  /* a lone button on the last line of
                                            the row never stretches right
                                            across the panel */
      min-height: 50px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: inherit;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      cursor: pointer;
    }

    .barn-horse-name {
      font-size: 18px;
      font-weight: 700;
    }

    .barn-horse-kind {
      font-size: 12px;
      opacity: 0.75;
    }

    /* The horse we are dressing right now: green, like the grass. */
    .barn-horse.selected {
      background: #6a9c33;
      border-color: #ffffff;
    }

    /* "Speed ★★★ · Stays full ★★" under the horse buttons. */
    .barn-stats {
      margin-top: 6px;
      font-size: 14px;
      color: #dbe4ee;
    }

    /* A round colour button. The colour itself is set by menu.js. */
    .barn-swatch {
      width: 46px;
      height: 46px;
      padding: 0;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      cursor: pointer;
    }

    /* The "None" button - not wearing one - is a plain grey circle. */
    .barn-swatch-none {
      background: #5b6472;
    }

    /* The colour this horse is wearing, ringed in thick white. */
    .barn-swatch.selected {
      border-color: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 0 4px #ffffff;
    }

    /* A foal is too little to wear a saddle, so while one is chosen every
       colour fades back and stops taking taps. */
    .barn-swatch:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* "Clover is too little for a saddle" - empty, and so invisible, whenever
       the chosen horse is a grown-up one. */
    .barn-tack-why {
      margin: -8px 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #ff9e80;
    }

    /* -----------------------------------------------------------------
       THE FOALS SECTION (Phase 7)
       Pick a mum, pick a dad, press the big green button. It lives at the
       bottom of the barn panel, under a dividing line, because it is the
       one thing in here that makes something new rather than changing
       something that is already on the ranch.
       ----------------------------------------------------------------- */
    .barn-foal {
      margin-top: 0;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }

    /* "Pick two horses. The foal's colour is a surprise!" */
    .barn-foal-hint {
      margin: -2px 0 8px;
      text-align: left;
      font-size: 13px;
      color: #dbe4ee;
    }

    /* The little "Mum" and "Dad" words over each row of horses. */
    .barn-foal-sub {
      margin: 0 0 6px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      opacity: 0.85;
    }

    /* A parent button: the same button as a horse button, a size down, so two
       rows of them still leave room for the big green button underneath. */
    .barn-parent {
      flex: 1 1 96px;
      max-width: 170px;
      min-height: 42px;
      padding: 4px 8px;
      font: inherit;
      color: #ffffff;
      background: #39414f;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      cursor: pointer;
    }

    .barn-parent .barn-horse-name {
      font-size: 15px;
    }

    .barn-parent .barn-horse-kind {
      font-size: 11px;
    }

    /* The horse picked as this row's parent: green, like the grass, exactly
       the way the chosen horse is marked in the row above. */
    .barn-parent.selected {
      background: #6a9c33;
      border-color: #ffffff;
    }

    /* A long herd wraps onto more lines and then scrolls, so eight horses can
       never push the Close button off the bottom of the screen. */
    .barn-choices-scroll {
      max-height: 148px;
      overflow-y: auto;
    }

    .barn-foal .barn-choices-scroll {
      max-height: 104px;
      margin-bottom: 10px;
    }

    /* The big green button. It is the same grass green as the shop's Buy
       buttons, because it does the same kind of thing: yes, go on. */
    .barn-foal-go {
      width: 100%;
      min-height: 52px;
      padding: 10px 18px;
      font: inherit;
      font-size: 19px;
      font-weight: 700;
      color: #23282f;
      background: #8bc34a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .barn-foal-go:disabled {
      color: #99a2ae;
      background: #5b6472;
      cursor: default;
    }

    /* Why the button is grey: "Pick a mum and a dad", "The ranch is full!". */
    .barn-foal-why {
      min-height: 18px;
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #ff9e80;
    }

    /* The happy news: "A palomino foal was born! Her name is Clover." */
    .barn-foal-note {
      min-height: 22px;
      font-size: 16px;
      font-weight: 700;
      color: #b9f6ca;
    }

    .barn-foal-note-bad {
      color: #ff9e80;
    }

    .barn-close {
      margin-top: 4px;
      min-height: 48px;
      padding: 10px 30px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: #23282f;
      background: #ffb300;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* "Start over" - the quiet grey button under Close. It is deliberately
       smaller and duller than Close: it is the one button in here that throws
       work away, so nothing about it should invite a tap. */
    .barn-reset {
      display: block;
      margin: 10px auto 0;
      padding: 6px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #b8c0cc;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 9px;
      cursor: pointer;
      opacity: 0.8;
    }

    /* The "Erase everything?" question. It replaces the Start over button in
       place, inside the panel, so nothing jumps around the screen. Hidden
       until menu.js adds the "visible" class. */
    .barn-confirm {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(198, 40, 40, 0.14);
      border: 1px solid rgba(255, 138, 128, 0.4);
    }

    .barn-confirm.visible {
      display: block;
    }

    .barn-confirm-text {
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #ffd7d2;
    }

    .barn-confirm-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    /* Red for "yes, really erase it", plain grey for "no, take me back". */
    .barn-confirm-yes,
    .barn-confirm-no {
      min-height: 40px;
      padding: 8px 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .barn-confirm-yes {
      color: #ffffff;
      background: #c62828;
    }

    .barn-confirm-no {
      color: #23282f;
      background: #dfe4ea;
    }

    /* -----------------------------------------------------------------
       THE STORE PANEL
       The panel that opens when the player presses E at the store door at
       the end of the road. js/shop.js builds it out of the barn menu's
       pieces above (.barn-menu, .barn-panel, .barn-title, .barn-close) so
       the two panels match; everything below is just the rows of goods.

       The same rows are what the market stall will use to SELL things, so
       nothing here says "buy" anywhere.
       ----------------------------------------------------------------- */

    /* "You have 🪙 20" - the first thing anybody looks at in a shop. */
    .shop-coins {
      margin: -8px 0 14px;
      font-size: 20px;
      font-weight: 700;
      color: #ffe082;
    }

    /* An optional line of friendly words under that. */
    .shop-intro {
      margin: -8px 0 14px;
      font-size: 14px;
      color: #dbe4ee;
    }

    /* The goods, one per line, stacked down the panel. */
    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    /* One row: a big icon, the name and price, then the button. */
    .shop-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.18);
      text-align: left;
    }

    /* The rows she cannot use right now fade back a little. */
    .shop-item-off {
      opacity: 0.6;
    }

    .shop-item-icon {
      width: 40px;
      font-size: 30px;
      line-height: 1;
      text-align: center;
    }

    .shop-item-text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .shop-item-label {
      font-size: 18px;
      font-weight: 700;
    }

    .shop-item-price {
      font-size: 15px;
      color: #ffe082;
    }

    /* "Not enough coins" / "The coop is full!" under the price. Empty (and so
       invisible) whenever the row is usable. */
    .shop-item-why {
      font-size: 13px;
      font-weight: 600;
      color: #ff9e80;
    }

    /* The big green Buy button. Grass green, so it reads as "yes, go on". */
    .shop-buy {
      min-width: 96px;
      min-height: 48px;
      padding: 10px 18px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: #23282f;
      background: #8bc34a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Can't afford it (or there is no room for it): a dull grey button that
       does not respond to a tap. */
    .shop-buy:disabled {
      color: #99a2ae;
      background: #5b6472;
      cursor: default;
    }

    /* THE FEED STORE sells five things since Phase 7 added the two packets of
       seed, which is one row more than an ordinary laptop screen has room for.
       Shaving three pixels off the top and bottom of each row is enough to put
       the whole shop - including the Close button - comfortably back on screen. */
    .shop-menu[data-shop="store"] .shop-item {
      padding: 7px 12px;
    }

    /* THE MARKET STALL is the long one: a chicken, two egg rows, the four
       things the neighbours grow AND the carrots out of her own garden come to
       eight. Eight rows in a single column do not fit on a laptop screen at any
       sensible size, so on a wide screen the stall is given a wider panel and
       lays its goods out in TWO COLUMNS, four rows deep - which is what a real
       market stall looks like anyway, and means nobody ever has to discover
       that the panel scrolls.

       Its rows are a notch shallower than the store's on top of that. On a
       phone the two columns fold back into one (see the media query further
       down) and the panel does the scrolling, which is the normal way round on
       a small screen. */
    .shop-menu[data-shop="market"] .barn-panel {
      max-width: 760px;
    }

    .shop-menu[data-shop="market"] .shop-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
    }

    .shop-menu[data-shop="market"] .shop-item {
      padding: 6px 12px;
    }

    .shop-menu[data-shop="market"] .shop-buy {
      min-height: 42px;
    }

    .shop-menu[data-shop="market"] .shop-item-icon {
      font-size: 26px;
    }

    /* The line that answers back: "Bought horse feed! (🌾 4)". It keeps its
       height even when it is empty, so nothing jumps about when it changes. */
    .shop-note {
      min-height: 24px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .shop-note-good {
      color: #b9f6ca;                  /* a happy green */
    }

    .shop-note-bad {
      color: #ff9e80;                  /* a gentle "no", never a harsh red */
    }

    /* On a phone the button drops under the words rather than squeezing the
       name of the thing into nothing - and the market stall's two columns fold
       back into one, because two of these rows side by side on a phone would be
       far too narrow to read. */
    @media (max-width: 700px) {
      .shop-buy {
        min-width: 76px;
        font-size: 16px;
      }

      .shop-item-icon {
        font-size: 24px;
        width: 32px;
      }

      .shop-menu[data-shop="market"] .shop-list {
        grid-template-columns: 1fr;
      }
    }

    /* -----------------------------------------------------------------
       THE TRADE PANEL
       The panel that opens when the player presses E next to a neighbour.
       js/trade.js builds it out of the very same pieces as the two shops
       (.barn-menu, .barn-panel, .barn-title, .shop-list, .shop-item,
       .shop-buy, .shop-note, .barn-close), so all four panels in the game
       look like brothers. Only the three rules below are its own.

       A trade costs no coins at all, so there is no "You have 🪙 20" line
       here - .trade-pocket counts out the things this family swaps instead.
       ----------------------------------------------------------------- */

    /* "You have 🥚 4 · 🌽 0" - only the things this neighbour's offers are
       about, so it never turns into the whole pocket. */
    .trade-pocket {
      margin: -6px 0 14px;
      font-size: 18px;
      font-weight: 700;
      color: #ffe082;
    }

    /* The swap in pictures, under the words: "🥚 2 → 🌽 3". It is the line a
       player who is not reading yet actually uses, so it is bigger than the
       price line it stands in for. */
    .trade-swap {
      font-size: 19px;
      line-height: 1.25;
      color: #ffe082;
    }

    /* The neighbour's own line ("Mrs. Garcia: “Hello Natalia!...”") is a
       little roomier than a shop's one-line intro, because it is somebody
       talking rather than a sign over a counter. */
    .trade-menu .shop-intro {
      margin: -4px 0 12px;
      font-size: 15px;
      line-height: 1.35;
      font-style: italic;
      color: #dbe4ee;
    }

    @media (max-width: 700px) {
      .trade-pocket {
        font-size: 16px;
      }

      .trade-swap {
        font-size: 17px;
      }
    }

    /* The little "Saved" note that blinks in the top-right corner after the
       player changes something. It fades itself out after a second and never
       takes a click, so it cannot get in the way of the game.

       It sits at 62px rather than 14px so it drops clear of the ☰ and 🔊
       buttons Phase 8 put in that corner (44px of button plus 10px above it
       and a little air underneath). */
    #saved {
      position: fixed;
      right: 14px;
      top: 62px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(20, 24, 30, 0.55);
      color: #e8ecf2;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      user-select: none;
      opacity: 0;                       /* hidden by default */
      transition: opacity 0.3s ease;
      z-index: 5;
    }

    #saved.visible {
      opacity: 0.9;
    }

    /* Phone screens: a slightly smaller title and slightly smaller circles,
       so three rows of buttons still fit without scrolling. */
    @media (max-width: 700px) {
      .barn-title {
        font-size: 24px;
      }

      .barn-swatch {
        width: 44px;
        height: 44px;
      }

      /* Two horses to a line, everywhere. One per line is lovely with three
         horses and a very long list with eight, and the parent rows below
         match it. */
      .barn-horse,
      .barn-parent {
        flex: 1 1 44%;
      }

      /* On a phone the PANEL does all the scrolling. A little scrolling box
         inside a scrolling panel is a horrible thing to hand an eight-year-old,
         so the rows here are as long as they need to be. */
      .barn-choices-scroll,
      .barn-foal .barn-choices-scroll {
        max-height: none;
      }
    }

    /* =================================================================
       PHASE 8 - THE FRONT OF THE GAME
       The title screen, the Esc pause menu, the two little buttons in the
       top-right corner, and a tidy-up pass over everything else so that it
       all still reads nicely on a phone.

       js/title.js builds all the HTML; everything it needs to look right is
       here. There is not one image file in any of it - the sun, the bunting
       and the key caps are all drawn by the browser out of CSS.
       ================================================================= */

    /* The friendly rounded lettering the front of the game is set in. Every
       name in the list is a font that is ALREADY on somebody's computer or
       phone - nothing is fetched from the internet, so the title screen draws
       instantly and works with no connection at all.
         ui-rounded / SF Pro Rounded   iPhones, iPads and Macs
         Segoe UI Variable Display     Windows 11
         Trebuchet MS                  older Windows, and a friendly shape
       ...and then the ordinary system font as a last resort. */
    :root {
      --round-font: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display",
                    "Trebuchet MS", "Segoe UI", system-ui, Arial, sans-serif;
      --ink: #3d2f22;                 /* the warm dark brown all the words are in */
    }

    /* -----------------------------------------------------------------
       THE TITLE SCREEN
       A soft sky-coloured sheet over the whole game with one card in the
       middle of it. The ranch itself is still being drawn underneath and
       turns very slowly, which is why the sheet is see-through.
       ----------------------------------------------------------------- */
    #title-screen {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;               /* a very short screen can scroll */
      /* Bright and warm at the top where the sun is, cooler and greener down
         at the bottom where the grass is - so the sheet feels like weather
         rather than a grey box over the game. */
      background:
        linear-gradient(180deg,
          rgba(128, 198, 234, 0.80) 0%,
          rgba(163, 216, 238, 0.52) 34%,
          rgba(72, 116, 72, 0.62) 100%);
      font-family: var(--round-font);
      color: var(--ink);
      user-select: none;
      z-index: 20;                    /* over the panels, over everything */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
    }

    #title-screen.visible {
      opacity: 1;
      visibility: visible;
    }

    /* While the front page is up, every scrap of in-game furniture goes away:
       the HUD, the keys hint, the compass, the "Saved" note and even the two
       corner buttons (the title screen has its own sound switch, and there is
       nothing to pause). js/title.js puts this class on the <body>. */
    body.title-up #hud,
    body.title-up #hint,
    body.title-up #compass-badge,
    body.title-up #prompt,
    body.title-up #message,
    body.title-up #saved,
    body.title-up #top-buttons {
      display: none;
    }

    /* The sun, up in the corner: one circle with a warm glow around it. It
       hangs just below the bunting rather than behind it. */
    .title-sun {
      position: absolute;
      left: 7%;
      top: 54px;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #fff6c9 0%, #ffe27a 55%, #ffcb45 100%);
      box-shadow: 0 0 44px 16px rgba(255, 224, 130, 0.55);
      pointer-events: none;
    }

    /* The bunting strung right across the top: twelve little triangles on a
       string. The string is the border along the top. */
    .title-bunting {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      border-top: 3px solid rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }

    .title-flag {
      width: 6.2%;
      max-width: 40px;
      height: 32px;
      /* A rectangle with its bottom two corners folded into a point. */
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      opacity: 0.92;
    }

    /* Five colours, over and over, so no two flags side by side ever match. */
    .title-flag:nth-child(5n + 1) { background: #ef5350; }
    .title-flag:nth-child(5n + 2) { background: #ffca28; }
    .title-flag:nth-child(5n + 3) { background: #66bb6a; }
    .title-flag:nth-child(5n + 4) { background: #42a5f5; }
    .title-flag:nth-child(5n + 5) { background: #ab47bc; }

    /* The card everything lives in. Cream rather than the dark grey the in-game
       panels use: this is the happy front page, not a control panel. */
    .title-card {
      position: relative;
      width: min(94vw, 560px);
      box-sizing: border-box;
      padding: 18px 22px 20px;
      border-radius: 28px;
      border: 4px solid rgba(255, 255, 255, 0.85);
      background: linear-gradient(180deg,
        rgba(255, 253, 247, 0.96) 0%,
        rgba(255, 243, 222, 0.96) 100%);
      box-shadow: 0 16px 46px rgba(0, 0, 0, 0.32);
      text-align: center;
    }

    /* The little row of friends over the name. */
    .title-friends {
      font-size: 30px;
      line-height: 1;
      letter-spacing: 6px;
      margin-bottom: 6px;
    }

    .title-name {
      margin: 0 0 16px;
      line-height: 1.05;
    }

    .title-name-small {
      font-size: 24px;
      font-weight: 700;
      color: #8a6239;                 /* a soft saddle brown */
      letter-spacing: 0.4px;
    }

    .title-name-big {
      font-size: 52px;
      font-weight: 800;
      color: #3f8f37;                 /* grass green */
      letter-spacing: 0.5px;
      /* A thin cream outline, so the green stays crisp against the card. */
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9), 0 6px 14px rgba(0, 0, 0, 0.14);
    }

    /* The big button. It is the only thing on this page a player HAS to find,
       so it is the biggest, greenest and roundest thing on it. */
    .title-play {
      display: block;
      width: 100%;
      max-width: 330px;
      min-height: 66px;
      margin: 0 auto;
      padding: 12px 26px;
      font: inherit;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #1f2c14;
      background: linear-gradient(180deg, #a5d95c 0%, #7cb832 100%);
      border: none;
      border-radius: 20px;
      box-shadow: 0 5px 0 #5e9021, 0 10px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .title-play:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #5e9021, 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    /* "New game" - quiet, and only there when there is a ranch to lose. */
    .title-new {
      display: block;
      min-height: 44px;
      margin: 10px auto 0;
      padding: 8px 18px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #8a6239;
      background: transparent;
      border: 2px solid rgba(138, 98, 57, 0.35);
      border-radius: 12px;
      cursor: pointer;
    }

    /* The "are you sure?" question, in place of the buttons that asked it. */
    .title-confirm {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(198, 40, 40, 0.10);
      border: 2px solid rgba(198, 40, 40, 0.28);
    }

    .title-confirm.visible {
      display: block;
    }

    .title-confirm-text {
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #a03028;
    }

    .title-confirm-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    /* The two answer buttons borrow the barn menu's red and grey, but they are
       a size up: this is a front page, and fingers are the point. */
    .title-confirm .barn-confirm-yes,
    .title-confirm .barn-confirm-no {
      min-height: 48px;
      font-size: 16px;
    }

    /* The sound switch. */
    .title-sound {
      display: block;
      min-height: 46px;
      margin: 14px auto 0;
      padding: 9px 20px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(61, 47, 34, 0.18);
      border-radius: 14px;
      cursor: pointer;
    }

    /* The one line the four how-to cards do not cover. */
    .title-esc {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(61, 47, 34, 0.62);
    }

    /* -----------------------------------------------------------------
       THE HOW-TO-PLAY STRIP
       Four little cards: a picture, the keys, three words. It is used twice -
       on the title screen and (folded away until asked for) in the pause menu.
       ----------------------------------------------------------------- */
    .howto {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .howto-card {
      padding: 8px 4px 9px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid rgba(61, 47, 34, 0.10);
    }

    .howto-pic {
      font-size: 26px;
      line-height: 1.1;
    }

    .howto-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      margin: 5px 0 4px;
    }

    /* A key cap, drawn the way a key looks: pale, rounded, with a little
       shadow underneath so it seems to stick up off the card.

       It is kept deliberately narrow so that all four of W A S D sit on ONE
       line inside a card about 120px wide, which is what the four cards come
       out at on a laptop. Four caps on one line and one on the next would
       leave that card taller than its three neighbours. */
    .howto-key {
      display: inline-block;
      min-width: 11px;
      padding: 2px 5px;
      font-family: var(--round-font);
      font-size: 11.5px;
      font-weight: 800;
      color: #4a3a2a;
      background: #ffffff;
      border: 1px solid #cfc0aa;
      border-radius: 6px;
      box-shadow: 0 2px 0 #cfc0aa;
    }

    .howto-words {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      color: rgba(61, 47, 34, 0.85);
    }

    /* -----------------------------------------------------------------
       THE PAUSE MENU (Esc)
       It borrows the barn menu's dark sheet and rounded panel, so it is
       plainly the same kind of thing as every other panel in the game.
       ----------------------------------------------------------------- */
    .pause-panel {
      max-width: 430px;
      font-family: var(--round-font);
    }

    .pause-sub {
      margin: -8px 0 16px;
      font-size: 15px;
      color: #dbe4ee;
    }

    .pause-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Resume: big and green, because it is what nearly every press of Esc is
       really asking for. */
    .pause-go {
      min-height: 58px;
      padding: 12px 20px;
      font: inherit;
      font-size: 22px;
      font-weight: 800;
      color: #1f2c14;
      background: linear-gradient(180deg, #a5d95c 0%, #7cb832 100%);
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 0 #5e9021;
      cursor: pointer;
    }

    .pause-button {
      min-height: 50px;
      padding: 10px 18px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.10);
      border: 2px solid rgba(255, 255, 255, 0.24);
      border-radius: 14px;
      cursor: pointer;
    }

    /* "Back to title" is the one button in here that takes the player out of
       their game, so it is duller than the rest and sits at the bottom. */
    .pause-quiet {
      font-size: 16px;
      color: #c3ccd8;
      background: transparent;
      border-color: rgba(255, 255, 255, 0.16);
    }

    /* The how-to strip inside the pause menu: folded away until the button is
       tapped, and recoloured for a dark panel. */
    .pause-howto {
      display: none;
      margin-top: 12px;
      /* The pause panel is narrower than the title card, so its four cards go
         two-by-two rather than in a row; four across this panel would squeeze
         "Feed the animals" onto three lines. (A phone held sideways gets the
         single row back further down, where height is the scarce thing.) */
      grid-template-columns: 1fr 1fr;
    }

    .pause-howto.visible {
      display: grid;
    }

    .pause-howto .howto-card {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .pause-howto .howto-words {
      color: #dbe4ee;
    }

    /* -----------------------------------------------------------------
       THE TWO LITTLE BUTTONS IN THE TOP-RIGHT CORNER
       ☰ opens the pause menu, 🔊 switches the sound. They are for anybody
       playing on a tablet, where there is no Esc key to press.

       z-index 6 puts them above the game and the HUD but BELOW the panels
       (which are 10), so while the barn menu is open they are tucked away
       behind its dark sheet instead of floating over it.
       ----------------------------------------------------------------- */
    #top-buttons {
      position: fixed;
      right: 10px;
      top: 10px;
      display: flex;
      gap: 8px;
      z-index: 6;
    }

    .top-button {
      width: 44px;                    /* a comfortable size for a fingertip */
      height: 44px;
      padding: 0;
      font-family: var(--round-font);
      font-size: 20px;
      line-height: 1;
      color: #ffffff;
      background: rgba(20, 24, 30, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 12px;
      cursor: pointer;
    }

    .top-button-off {
      opacity: 0.65;
    }

    /* -----------------------------------------------------------------
       THE PHONE AND TABLET PASS
       Two sizes to think about, and they are very different shapes:
         a phone held upright   390 x 844 - narrow, and tall enough for anything
         a phone held sideways  844 x 390 - wide, and VERY short
       The first query below is about width, the second about height, and a
       phone on its side gets both.
       ----------------------------------------------------------------- */
    @media (max-width: 700px) {
      /* The name of the game has to fit a narrow screen without being broken
         across three lines. */
      .title-name-small { font-size: 19px; }
      .title-name-big { font-size: 40px; }
      .title-friends { font-size: 25px; }
      .title-card { padding: 16px 16px 18px; border-radius: 22px; }
      .title-sun { width: 62px; height: 62px; left: 5%; }

      /* Four cards side by side on a 390px screen would be 85px each, which is
         too narrow for "Feed the animals". Two rows of two it is. */
      .howto { grid-template-columns: 1fr 1fr; }

      /* The corner hint is allowed to WRAP down here. Held to one line it ran
         straight off the side of a narrow screen. */
      #hint {
        max-width: 62vw;
        white-space: normal;
      }

      /* THE TOP OF A PHONE SCREEN is only 390 pixels across, and the HUD alone
         is more than half of it - so the compass, which sits in the middle of
         the screen on a laptop, would be printed straight over the numbers.
         Down here it moves to the right-hand edge instead, tucked under the ☰
         and 🔊 buttons, where there is nothing else to bump into. */
      #compass-badge {
        left: auto;
        right: 10px;
        top: 62px;
        transform: none;
      }

      /* ...which is where the "Saved" note used to be, so that drops another
         notch, to just under the compass. */
      #saved {
        top: 116px;
      }

      /* And the second HUD line gets more of the screen before it wraps: at
         46vw a full basket ran to three lines. */
      #hud-goods {
        max-width: 62vw;
      }
    }

    /* CLOSE IS ALWAYS REACHABLE. The barn menu is the one panel in the game
       that is taller than a phone screen - a button for every horse, two rows
       of colours and the whole Foals section - so it scrolls. A Close button
       that has scrolled off the bottom is no use at all to an eight-year-old,
       so on any screen small enough for a panel to scroll, Close sticks to the
       bottom of it and stays there.

       Stuck there it becomes a little footer bar rather than a button floating
       over the rows: full width, with a solid band of the panel's own colour
       around it and that band fading upwards, so nothing ever shows through
       from underneath as the panel scrolls past behind it. */
    @media (max-width: 700px), (max-height: 520px) {
      .barn-close {
        position: sticky;
        bottom: 0;
        z-index: 1;
        display: block;
        width: 100%;
        margin-top: 10px;
        box-shadow:
          0 0 0 14px rgba(28, 34, 44, 0.96),
          0 -12px 18px 14px rgba(28, 34, 44, 0.86);
      }
    }

    @media (max-height: 520px) {
      /* A phone on its side has about 390px of height for everything. The
         title screen sits at the top of it and scrolls if it must, rather than
         being trapped in the middle of a box it does not fit in. */
      #title-screen { align-items: flex-start; padding-top: 10px; }
      .title-card { padding: 12px 16px 14px; }
      .title-friends { display: none; }
      .title-name { margin-bottom: 10px; }
      .title-name-small { font-size: 17px; }
      .title-name-big { font-size: 34px; }
      .title-play { min-height: 54px; font-size: 22px; }
      .title-sound { min-height: 44px; margin-top: 10px; }
      .title-sun { display: none; }
      .howto { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
      .howto-pic { font-size: 20px; }
      .howto-words { font-size: 11px; }
      .title-esc { margin-top: 8px; font-size: 12px; }

      /* Every panel in the game gets a little more of the screen and a little
         less padding, so the Close button at the bottom is always reachable. */
      .barn-menu { padding: 8px; }
      .barn-panel { max-height: 97vh; padding: 12px 14px 14px; }
      .barn-title { font-size: 20px; margin-bottom: 8px; }
      .pause-sub { display: none; }
      .pause-go { min-height: 48px; font-size: 19px; }
      .pause-button { min-height: 44px; font-size: 16px; }
      .barn-close { min-height: 44px; }

      /* The corner hint keeps only the keys; the two lines of advice about
         where to go would eat a third of the screen. */
      .hint-extra { display: none; }
      #hint { font-size: 11px; }
      /* ...which makes the hint box three lines instead of five, so the
         "Press E to ..." prompt can sit lower and out of the way. */
      #prompt { bottom: 74px; font-size: 15px; }
      #message { top: 58px; font-size: 15px; }
    }
  </style>

  <!-- Import map: tells the browser where the bare name "three" points to.
       No npm and no bundler needed - the browser loads it straight from the CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- What Natalia is carrying, top-left. js/inventory.js writes the numbers
       into #hud-items and the words into #hud-legend. The "title" is filled in
       too, so hovering over it says the same thing. -->
  <div id="hud" title="coins · horse feed · chicken feed · eggs · chickens">
    <div id="hud-items">🪙 20 · 🌾 3 · 🥣 5 · 🥚 0 · 🐔 4</div>
    <div id="hud-legend">coins · horse feed · chicken feed · eggs · chickens</div>
    <!-- What she has traded for with the neighbours, e.g. "🌽 3 corn".
         It stays empty - and hidden - until she owns some of something. -->
    <div id="hud-goods"></div>
  </div>

  <!-- On-screen controls hint: five short lines, tucked in the corner. It is
       deliberately this short - the "Press E to ..." prompt in the middle of
       the screen already says what E does at each place, so the corner only
       has to cover the keys themselves and where to go.

       The last two lines live inside .hint-extra so that a short screen (a
       phone held sideways) can drop them and keep only the keys, which is the
       part a player actually needs in front of them. -->
  <div id="hint">
    <b>Move:</b> W A S D / arrows<br>
    <b>Look:</b> drag mouse<br>
    <b>E:</b> use / ride&nbsp;&nbsp;<b>F:</b> feed&nbsp;&nbsp;<b>Esc:</b> menu<br>
    <span class="hint-extra">Follow the compass to the store<br>
    Visit neighbours &middot; grow crops</span>
  </div>

  <!-- The compass badge at the top of the screen. js/road.js turns the arrow
       and sets data-target, and the CSS above turns that into the word
       underneath ("Store" on the way out, "Home" on the way back). -->
  <div id="compass-badge">
    <div id="compass" data-target="store">▲</div>
    <div id="compass-label"></div>
  </div>

  <!-- "Press E to ..." appears here when Natalia is close to something. -->
  <div id="prompt"></div>

  <!-- Short feedback, like "Yum! Biscuit is happy.", flashes up here. -->
  <div id="message"></div>

  <!-- "Saved" blinks here for a second whenever the game writes the ranch to
       the browser's storage after the player changes something. -->
  <div id="saved">Saved</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
